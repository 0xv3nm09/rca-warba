services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "python -m rca.adapters.dummy.seed && uvicorn rca.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      RCA_PROFILE: local
      DATABASE_URL: postgresql+asyncpg://rca:rca@postgres:5432/rca
      REDIS_URL: redis://redis:6379/0
      LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL:-dummy-extractor}
      LLM_EXTRACT_BASE_URL: ${LLM_EXTRACT_BASE_URL:-local}
      LLM_DRAFT_MODEL: ${LLM_DRAFT_MODEL:-dummy-drafter}
      LLM_DRAFT_BASE_URL: ${LLM_DRAFT_BASE_URL:-local}
      LLM_CLASSIFY_MODEL: ${LLM_CLASSIFY_MODEL:-dummy-classifier}
      LLM_CLASSIFY_BASE_URL: ${LLM_CLASSIFY_BASE_URL:-local}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-dev-only-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: arq rca.ingest.worker.WorkerSettings
    environment:
      RCA_PROFILE: local
      DATABASE_URL: postgresql+asyncpg://rca:rca@postgres:5432/rca
      REDIS_URL: redis://redis:6379/0
      LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL:-dummy-extractor}
      LLM_EXTRACT_BASE_URL: ${LLM_EXTRACT_BASE_URL:-local}
      LLM_DRAFT_MODEL: ${LLM_DRAFT_MODEL:-dummy-drafter}
      LLM_DRAFT_BASE_URL: ${LLM_DRAFT_BASE_URL:-local}
      LLM_CLASSIFY_MODEL: ${LLM_CLASSIFY_MODEL:-dummy-classifier}
      LLM_CLASSIFY_BASE_URL: ${LLM_CLASSIFY_BASE_URL:-local}
      EMBED_BACKEND: ${EMBED_BACKEND:-hash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-me}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m rca.adapters.dummy.seed
    environment:
      DATABASE_URL: postgresql+asyncpg://rca:rca@postgres:5432/rca
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgdata:
