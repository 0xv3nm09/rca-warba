<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1646" viewBox="0 0 900 1646"><rect width="900" height="1646" fill="#ffffff"/><text x="450" y="38" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8a94a6" text-anchor="middle" letter-spacing="2.4">RCA · PIPELINE FLOW — FROM BANK RECORD TO A SAFE HANDOVER</text><rect x="40" y="60" width="820" height="105" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="70" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="85.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="90" y="85.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">SOURCE SYSTEMS</text><text x="56" y="95" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">crm · core_banking · ecm · mail · hr</text><text x="56" y="120" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Read through plug-in adapters. Prototype uses dummy adapters — synthetic data only.</text><rect x="56" y="134" width="79.19999999999999" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="147.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">records[]</text><line x1="450" y1="167" x2="450" y2="182" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,181 456,181 450,191" fill="#9aa7ba"/><rect x="40" y="193" width="820" height="122" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="203" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="218.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="90" y="218.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">INGEST</text><text x="56" y="228" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">sanitise + input_guard()</text><text x="56" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Hidden HTML-comment channels stripped before anything reads a record;</text><text x="56" y="270" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">override questions refused — English and Arabic.</text><rect x="56" y="284" width="86.0" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="297.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">clean_text</text><line x1="450" y1="317" x2="450" y2="326" stroke="#9aa7ba" stroke-width="1.5"/><line x1="241" y1="326" x2="659" y2="326" stroke="#9aa7ba" stroke-width="1.5"/><line x1="241" y1="326" x2="241" y2="336" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="235,335 247,335 241,345" fill="#9aa7ba"/><line x1="659" y1="326" x2="659" y2="336" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="653,335 665,335 659,345" fill="#9aa7ba"/><rect x="40" y="347" width="402" height="109" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="357" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="372.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3a</text><text x="90" y="372.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">RULES RUN FIRST</text><text x="56" y="394" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Deterministic extractor runs before the model —</text><text x="56" y="411" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">its claims can never be dropped.</text><rect x="56" y="425" width="113.2" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="438.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">claims_rules[]</text><rect x="458" y="456" width="402" height="122" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="474" y="466" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="486" y="481.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3b</text><text x="508" y="481.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">MODEL ADDS BREADTH</text><text x="474" y="491" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">gateway route: extract</text><text x="474" y="516" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Any OpenAI-compatible endpoint or built-in dummy</text><text x="474" y="533" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">routes. The model proposes — code disposes.</text><rect x="474" y="547" width="113.2" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="483" y="560.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">claims_model[]</text><line x1="241" y1="580" x2="241" y2="592" stroke="#9aa7ba" stroke-width="1.5"/><line x1="659" y1="580" x2="659" y2="592" stroke="#9aa7ba" stroke-width="1.5"/><line x1="241" y1="592" x2="659" y2="592" stroke="#9aa7ba" stroke-width="1.5"/><line x1="450" y1="592" x2="450" y2="599" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,598 456,598 450,608" fill="#9aa7ba"/><rect x="40" y="610" width="820" height="122" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="620" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="635.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="90" y="635.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">UNION + DISPOSITION</text><text x="56" y="645" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">code decides kinds</text><text x="56" y="670" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Dated promise → commitment register · signatory mention → mandate check ·</text><text x="56" y="687" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">amounts → conflict pass.</text><rect x="56" y="701" width="174.4" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="714.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">claims[] + dispositions</text><line x1="450" y1="734" x2="450" y2="749" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,748 456,748 450,758" fill="#9aa7ba"/><rect x="40" y="760" width="820" height="122" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="770" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="785.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="90" y="785.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">VERIFY</text><text x="56" y="795" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">span · numbers · entailment</text><text x="56" y="820" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Quote found verbatim in the source? Numbers match the structured fields?</text><text x="56" y="837" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Anything less becomes a gap — never a fact.</text><rect x="56" y="851" width="133.6" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="864.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">verified_claims[]</text><line x1="450" y1="884" x2="450" y2="899" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,898 456,898 450,908" fill="#9aa7ba"/><rect x="40" y="910" width="820" height="122" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="920" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="935.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="90" y="935.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">LABEL</text><text x="56" y="945" font-family="Menlo,Consolas,monospace" font-size="10.5" font-weight="normal" fill="#5b6b81" text-anchor="start">confidence computed, never asked</text><text x="56" y="970" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Span, numbers, source authority, freshness, agreement →</text><text x="56" y="987" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">verified · needs_review · conflict · not_in_records · escalate.</text><rect x="56" y="1001" width="126.8" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="1014.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">facts[] + labels</text><line x1="450" y1="1034" x2="450" y2="1049" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,1048 456,1048 450,1058" fill="#9aa7ba"/><rect x="40" y="1060" width="820" height="109" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><rect x="56" y="1070" width="24" height="22" rx="5" fill="#0b1f3a"/><text x="68" y="1085.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="90" y="1085.5" font-family="Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0b1f3a" text-anchor="start">THE LIVING FILE</text><text x="56" y="1107" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">One sourced story per client — every fact carries its citation; Arabic renders</text><text x="56" y="1124" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">RTL; conflicts shown, never hidden.</text><rect x="56" y="1138" width="249.2" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="1151.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">file: facts · commitments · people</text><line x1="450" y1="1171" x2="450" y2="1180" stroke="#9aa7ba" stroke-width="1.5"/><line x1="172" y1="1180" x2="728" y2="1180" stroke="#9aa7ba" stroke-width="1.5"/><line x1="172" y1="1180" x2="172" y2="1190" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="166,1189 178,1189 172,1199" fill="#9aa7ba"/><line x1="450" y1="1180" x2="450" y2="1190" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,1189 456,1189 450,1199" fill="#9aa7ba"/><line x1="728" y1="1180" x2="728" y2="1190" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="722,1189 734,1189 728,1199" fill="#9aa7ba"/><rect x="40" y="1201" width="264" height="109" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><text x="56" y="1225" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b1f3a" text-anchor="start">CITED ASK</text><text x="56" y="1248" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Approval answers from commitment</text><text x="56" y="1265" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">states — never a note&#x27;s wording.</text><rect x="56" y="1279" width="140.39999999999998" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="65" y="1292.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">answer + citations</text><rect x="318" y="1310" width="264" height="109" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><text x="334" y="1334" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b1f3a" text-anchor="start">HANDOVER</text><text x="334" y="1357" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Recollection never promotes; close</text><text x="334" y="1374" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">blocked until every item is owned.</text><rect x="334" y="1388" width="147.2" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="343" y="1401.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">package + readiness</text><rect x="596" y="1419" width="264" height="109" rx="10" fill="#f7f9fc" stroke="#d8dfeb" stroke-width="1.5"/><text x="612" y="1443" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b1f3a" text-anchor="start">AGENTS</text><text x="612" y="1466" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">Cover briefs, nightly scans, triage —</text><text x="612" y="1483" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#3d4a5f" text-anchor="start">human gate on every trigger.</text><rect x="612" y="1497" width="174.4" height="19" rx="4" fill="#fdf6e8" stroke="#ecd9ae" stroke-width="1"/><text x="621" y="1510.5" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#7a5b12" text-anchor="start">briefs · alerts · packs</text><line x1="450" y1="1530" x2="450" y2="1539" stroke="#9aa7ba" stroke-width="1.5"/><line x1="172" y1="1539" x2="728" y2="1539" stroke="#9aa7ba" stroke-width="1.5"/><line x1="172" y1="1539" x2="172" y2="1549" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="166,1548 178,1548 172,1558" fill="#9aa7ba"/><line x1="450" y1="1539" x2="450" y2="1549" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="444,1548 456,1548 450,1558" fill="#9aa7ba"/><line x1="728" y1="1539" x2="728" y2="1549" stroke="#9aa7ba" stroke-width="1.5"/><polygon points="722,1548 734,1548 728,1558" fill="#9aa7ba"/><rect x="40" y="1560" width="820" height="58" rx="10" fill="#0b1f3a"/><text x="450" y="1585" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#f4d9a0" text-anchor="middle">HASH-CHAINED AUDIT</text><text x="450" y="1605" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#c9d4e4" text-anchor="middle">Every read, draft and decision appended with hash(prev) — verify at GET /admin/audit/verify</text></svg>