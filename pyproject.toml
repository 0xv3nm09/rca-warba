[project]
name = "rca"
version = "0.1.0"
description = "Relationship Continuity Assistant - Warba Bank Corporate Banking AI Challenge, Track 2 prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "httpx>=0.27",
  "tenacity>=8.5",
  "python-ulid>=2.6",
  "sqlalchemy[asyncio]>=2.0.31",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "openai>=1.40",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.108",
  "ruff>=0.6",
  "aiosqlite>=0.20",
]
ml = [
  "torch>=2.4",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "numpy",
  "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"rca/app/**" = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
